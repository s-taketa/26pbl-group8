<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証コード入力 | AI見守りアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="verify-container">
        <div class="verify-header">
            <a href="forgot-password.html" class="back-btn" id="back-btn">← 戻る</a>
        </div>

        <h1>4桁の認証コードを入力してください</h1>

        <!-- サーバーからのエラー/通知をここに表示。alert() は使わない -->
        <div id="form-message" class="form-message" role="alert" aria-live="assertive" hidden></div>

        <form id="verify-form" novalidate>
            <div class="code-input-group" role="group" aria-label="4桁の認証コード">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-digit" id="code-1" aria-label="1桁目" autocomplete="one-time-code">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-digit" id="code-2" aria-label="2桁目">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-digit" id="code-3" aria-label="3桁目">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-digit" id="code-4" aria-label="4桁目">
            </div>
            <p class="field-error" id="code-error" hidden></p>

            <div class="verify-actions">
                <button type="submit" id="submit-btn" class="btn-inline">
                    <span class="btn-label">次へ</span>
                </button>
            </div>
        </form>
    </main>

    <script src="verify-code.js"></script>
</body>
</html>
