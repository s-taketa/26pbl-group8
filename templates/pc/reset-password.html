<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワードを入力</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ワイヤーフレーム通りの赤文字エラー用スタイル */
        .password-match-error {
            color: #ff0000;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
            min-height: 24px; /* エラーがない時もレイアウトが崩れないように枠を確保 */
        }
    </style>
</head>
<body>
<div class="login-container relative-container">
    <a href="verify-code.html" class="back-link">戻る</a>

    <h1 class="text-center">新しいパスワードを入力</h1>

    <form id="reset-form" novalidate>
        <div class="form-group">
            <label for="new-password" class="sr-only">新しいパスワードを入力</label>
            <input type="password" id="new-password" placeholder="新しいパスワードを入力" required>
        </div>

        <div class="form-group">
            <label for="confirm-password" class="sr-only">もう一度</label>
            <input type="password" id="confirm-password" placeholder="もう一度" required>
        </div>

        <div id="match-error" class="password-match-error"></div>

        <div class="forgot-actions">
            <button type="submit" id="reset-btn" class="btn-inline">完了</button>
        </div>
    </form>
</div>

<script src="reset-password.js"></script>
</body>
</html>
