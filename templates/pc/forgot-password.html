<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードを忘れた場合 | AI見守りアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="forgot-container">
        <div class="forgot-header">
            <a href="login.html" class="back-btn" id="back-btn">← 戻る</a>
        </div>

        <h1>パスワードを忘れた場合</h1>
        <p class="forgot-description">登録したメールアドレスまたは電話番号を入力</p>

        <!-- サーバーからのエラー/通知をここに表示。alert() は使わない -->
        <div id="form-message" class="form-message" role="alert" aria-live="assertive" hidden></div>

        <form id="forgot-form" novalidate>
            <div class="form-group">
                <label for="login-id" class="sr-only">メールアドレスまたは電話番号</label>
                <input
                    type="text"
                    id="login-id"
                    name="login-id"
                    inputmode="email"
                    autocomplete="username"
                    placeholder="メールアドレスまたは電話番号"
                    required
                >
                <p class="field-error" id="login-id-error" hidden></p>
            </div>

            <div class="forgot-actions">
                <button type="submit" id="submit-btn" class="btn-inline">
                    <span class="btn-label">送信して次へ</span>
                </button>
            </div>
        </form>
    </main>

    <script src="forgot-password.js"></script>
</body>
</html>
