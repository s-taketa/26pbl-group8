<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | AI見守りアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="register-container">
        <div class="register-header">
            <a href="login.html" class="back-btn" id="back-btn">戻る</a>
            <h1>登録</h1>
        </div>

        <!-- サーバーからのエラー/通知をここに表示。alert() は使わない -->
        <div id="form-message" class="form-message" role="alert" aria-live="assertive" hidden></div>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="login-id">電話番号またはメールアドレス</label>
                <input
                    type="text"
                    id="login-id"
                    name="login-id"
                    inputmode="email"
                    autocomplete="username"
                    placeholder="example@mail.com / 09012345678"
                    required
                >
                <p class="field-error" id="login-id-error" hidden></p>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >
                <p class="field-error" id="password-error" hidden></p>
            </div>

            <div class="form-group form-group--confirm">
                <label for="password-confirm" class="sr-only">パスワード（確認）</label>
                <input
                    type="password"
                    id="password-confirm"
                    name="password-confirm"
                    autocomplete="new-password"
                    placeholder="パスワード（確認）"
                    required
                >
                <p class="field-error" id="password-confirm-error" hidden></p>
            </div>

            <div class="submit-row">
                <button type="submit" id="submit-btn">
                    <span class="btn-label">登録完了</span>
                </button>
            </div>
        </form>
    </main>

    <script src="register.js"></script>
</body>
</html>
