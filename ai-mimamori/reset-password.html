<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワードを入力</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container relative-container">
    <a href="verify-code.html" class="back-link">戻る</a>

    <h1 class="text-center">新しいパスワードを入力</h1>
    
    <div id="form-error" class="form-error-main" aria-live="polite"></div>

    <form id="reset-form" novalidate>
        <div class="form-group">
            <label for="new-password" class="sr-only">新しいパスワードを入力</label>
            <input type="password" id="new-password" placeholder="新しいパスワードを入力" required autocomplete="new-password">
            <div class="field-error" id="new-password-error"></div>
        </div>

        <div class="form-group">
            <label for="confirm-password" class="sr-only">もう一度入力</label>
            <input type="password" id="confirm-password" placeholder="もう一度" required autocomplete="new-password">
            <div class="field-error" id="confirm-password-error"></div>
        </div>

        <div class="forgot-actions">
            <button type="submit" id="submit-btn" class="btn-inline">完了</button>
        </div>
    </form>
</div>

<script src="reset-password.js"></script>
</body>
</html>
